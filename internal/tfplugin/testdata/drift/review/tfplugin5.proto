// Synthetic baseline for scripts/proto-drift.sh --self-test. Package,
// service and method names match the real protocol; the bodies are tiny so
// the fixtures never need updating when the vendored pin moves.
syntax = "proto3";
package tfplugin5;

enum StringKind {
    PLAIN = 0;
    MARKDOWN = 1;
    HTML = 2;
}

message Schema {
    int64 version = 1;
    StringKind description_kind = 2;
}

message GetMetadata {
    message Request {}
    message Response {
        repeated string resource_types = 1;
    }
}

message PlanResourceChange {
    message Request {
        string type_name = 1;
        Schema schema = 2;
    }
    message Response {
        bytes planned_state = 1;
    }
}

service Provider {
    rpc GetMetadata(GetMetadata.Request) returns (GetMetadata.Response);
    rpc PlanResourceChange(PlanResourceChange.Request) returns (PlanResourceChange.Response);
}
