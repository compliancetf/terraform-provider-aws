name: Upstream watch

# Opens the pin-bump PR for the next hashicorp/aws release
# (version parity: compliancetf/aws X.Y.Z proxies hashicorp/aws X.Y.Z).
# tools/upstreamwatch picks the version: the oldest release newer than
# pins.json, one pin PR at a time (each rewrites the same files), none
# skipped; nothing while a pin/hashicorp-aws-* branch has an open PR, and a
# red run when such a branch has none. A dispatch may name a newer release.
#
# The pin job runs `make pin` (it executes the downloaded, signature-checked
# upstream provider) with a read-only token and hands its one commit over as
# a git bundle. The publish job runs no repository or upstream code: it
# checks the commit (one commit on the run's master SHA, make pin outputs
# only),
# pushes the branch and opens the PR. When `make pin` stops for an owner
# decision, the partial commit opens as a draft PR carrying the message.
#
# A PR opened with GITHUB_TOKEN starts no workflows, so this run tests the
# pin commit itself: the test job calls test.yml on its SHA. When every job
# passed, make pin needed no owner decision and no re-signing, and master is
# still the commit the pin was made on, the merge job squash-merges that SHA,
# tags the merge commit vX.Y.Z and dispatches release.yml on the tag (a tag
# created with GITHUB_TOKEN starts no push workflow). Otherwise the PR waits
# for the owner and the run is red.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: hashicorp/aws release to pin, X.Y.Z (default the oldest newer than pins.json)
        type: string
        default: ""

permissions: {}

concurrency:
  group: upstream-watch
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  pin:
    name: Pick and pin
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      next: ${{ steps.pick.outputs.next }}
      branch: ${{ steps.pick.outputs.branch }}
      status: ${{ steps.pin.outputs.status }}
      resign: ${{ steps.pin.outputs.resign }}
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      # The run's SHA in both jobs: the bundle's prerequisite and parent check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Pick the version
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WANT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/watch"
          mkdir -p "$d"
          curl -fsSL --proto '=https' --max-filesize 16777216 -o "$d/versions.json" \
            https://registry.terraform.io/v1/providers/hashicorp/aws/versions
          gh api "repos/$REPO/git/matching-refs/heads/pin/hashicorp-aws-" --jq '.[].ref' \
            | sed 's|^refs/heads/||' >"$d/branches.txt"
          # Same-repo heads only: a fork branch of the same name is not a pin PR.
          gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            | jq -r --arg repo "$REPO" '.[] | select(.head.repo.full_name == $repo) | .head.ref' >"$d/open.txt"
          go run ./tools/upstreamwatch -versions "$d/versions.json" -branches "$d/branches.txt" \
            -open "$d/open.txt" -version "$WANT" | tee -a "$GITHUB_OUTPUT"

      - if: steps.pick.outputs.next != ''
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      # The jq that captured testdata/schemas (aws-subset.provenance.json).
      - name: Install jq (pinned sha256)
        if: steps.pick.outputs.next != ''
        env:
          JQ_VERSION: jq-1.8.2
          JQ_SHA256: b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/bin/jq" \
            "https://github.com/jqlang/jq/releases/download/$JQ_VERSION/jq-linux-amd64"
          echo "$JQ_SHA256  $RUNNER_TEMP/bin/jq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/jq"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: make pin
        id: pin
        if: steps.pick.outputs.next != ''
        env:
          NEXT: ${{ steps.pick.outputs.next }}
          BRANCH: ${{ steps.pick.outputs.branch }}
          PINNED: ${{ steps.pick.outputs.pinned }}
          QUEUED: ${{ steps.pick.outputs.queued }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          status=ok
          make pin VERSION="$NEXT" >"$out/pin.log" 2>&1 || status=failed
          cat "$out/pin.log"
          # Only tools/cispin's owner-decision stop opens a draft; any other failure is a red run.
          if [ "$status" = failed ]; then
            grep -q '^cispin: owner decision:' "$out/pin.log" || { echo "::error::make pin VERSION=$NEXT failed; see the log above"; exit 1; }
            status=owner-action
          fi
          git switch -c "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::make pin VERSION=$NEXT changed nothing (pinupstream failed?); see the log above"
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "chore(pin): hashicorp/aws $NEXT"
          resign=false
          git diff --quiet HEAD~1 HEAD -- internal/embedded/cis/ || resign=true
          git bundle create "$out/pin.bundle" "$BRANCH" "^$GITHUB_SHA"
          {
            if [ "$status" = owner-action ]; then
              echo "> [!WARNING]"
              echo "> \`make pin VERSION=$NEXT\` stopped for an owner decision (log below). This draft carries what it wrote before it stopped. Resolve it (for example review the controls and widen the CIS manifest \`version_range\`), then on this branch run \`make pin VERSION=$NEXT\` again and push."
              echo
            fi
            echo "Pins hashicorp/aws **$NEXT** (was $PINNED): \`make pin VERSION=$NEXT\` from the [upstream watch run]($RUN_URL)."
            echo
            echo "## Changed"
            echo
            echo '```'
            git diff --stat HEAD~1 HEAD
            echo '```'
            echo
            echo "## Owner steps"
            echo
            if [ "$status" = owner-action ]; then
              echo "1. Re-signing is decided after the owner decision: once \`make pin VERSION=$NEXT\` passes on this branch, re-sign \`internal/embedded/cis.tar.gz\` with \`KEY=<production bundle key PEM> scripts/owner-sign-cis.sh\` if it changed \`internal/embedded/cis/\`."
            elif [ "$resign" = true ]; then
              echo "1. The CIS manifest changed, so \`internal/embedded/cis.tar.gz\` must be re-signed; until then TestReleaseKeyGuard fails and \`make test\` stays red (expected):"
              echo
              echo '   ```bash'
              echo "   git fetch origin && git switch $BRANCH"
              echo "   KEY=<production bundle key PEM> scripts/owner-sign-cis.sh"
              echo "   git add internal/embedded/cis.tar.gz && git commit -m \"chore(pin): re-sign cis.tar.gz for hashicorp/aws $NEXT\" && git push"
              echo '   ```'
            else
              echo "1. The CIS manifest did not change: \`cis.tar.gz\` needs no re-signing."
            fi
            if [ "$status" = ok ] && [ "$resign" = false ]; then
              echo "2. Nothing, unless the [upstream watch run]($RUN_URL) is red. That run tests this commit (\`make test\` on Linux, macOS and Windows, lint, build); when every job passes and master has not moved, it merges this PR, tags \`v$NEXT\` and starts the release."
              echo "3. If the run is red, this PR stays open: run \`make test\` and \`GOTOOLCHAIN=go1.26.2 make lint\` locally, merge by hand, then tag the merge commit on master: \`git tag -a v$NEXT <merge SHA> -m v$NEXT && git push origin v$NEXT\`."
            else
              echo "2. No CI runs on this PR: it was opened with GITHUB_TOKEN, which starts no workflows (the protected-paths gate included), and the repo has no PR CI. Run \`make test\` and \`GOTOOLCHAIN=go1.26.2 make lint\` locally."
              echo "3. Merge by hand. Then tag the merge commit on master: \`git tag -a v$NEXT <merge SHA> -m v$NEXT && git push origin v$NEXT\` (release.yml requires the tag to equal the pins.json version)."
            fi
            echo
            if [ -n "$QUEUED" ]; then
              echo "Newer releases wait for this PR to merge, then open one per day in order: $QUEUED."
            fi
            echo
            echo "<details><summary>make pin output</summary>"
            echo
            echo '~~~'
            # Tool output: no markup can close the fence or the details block.
            tail -n 60 "$out/pin.log" | tr '<>`~' '    '
            echo '~~~'
            echo
            echo "</details>"
          } >"$out/body.md"
          {
            echo "status=$status"
            echo "resign=$resign"
            echo "sha=$(git rev-parse HEAD)"
          } >>"$GITHUB_OUTPUT"
      - if: steps.pick.outputs.next != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pin
          path: |
            ${{ runner.temp }}/out/pin.bundle
            ${{ runner.temp }}/out/body.md
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Open the pin PR
    needs: pin
    if: needs.pin.outputs.next != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.open.outputs.pr }}
    steps:
      # The run's SHA in both jobs: the bundle's prerequisite and parent check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pin
          path: ${{ runner.temp }}/pin
      - name: Check the commit, push the branch, open the PR
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NEXT: ${{ needs.pin.outputs.next }}
          BRANCH: ${{ needs.pin.outputs.branch }}
          STATUS: ${{ needs.pin.outputs.status }}
          SHA: ${{ needs.pin.outputs.sha }}
          RESIGN: ${{ needs.pin.outputs.resign }}
        run: |
          set -euo pipefail
          [[ "$NEXT" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ && "$BRANCH" == "pin/hashicorp-aws-$NEXT" ]] \
            || { echo "::error::bad version or branch: $NEXT $BRANCH"; exit 1; }
          [[ "$STATUS" == ok || "$STATUS" == owner-action ]] || { echo "::error::bad status: $STATUS"; exit 1; }
          d="$RUNNER_TEMP/pin"
          git bundle verify -q "$d/pin.bundle"
          git fetch -q "$d/pin.bundle" "refs/heads/$BRANCH:refs/heads/$BRANCH"
          [ "$(git rev-parse "$BRANCH")" = "$SHA" ] || { echo "::error::$BRANCH is not the pin commit $SHA"; exit 1; }
          # Exactly one commit, whose only parent is the run's master SHA, touching
          # the make pin outputs only (renames listed as delete plus add).
          [ "$(git show -s --format=%P "$BRANCH")" = "$GITHUB_SHA" ] || { echo "::error::$BRANCH is not one commit on $GITHUB_SHA"; exit 1; }
          allowed='^(pins\.json|releases\.json|testdata/schemas/aws/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.json|testdata/schemas/aws-subset(\.provenance)?\.json|internal/embedded/cis/manifest\.json|internal/embedded/testdata/schema_compat\.tsv|internal/embedded/cis_ctftest\.tar\.gz)$'
          if other=$(git diff --no-renames --name-only "$GITHUB_SHA" "$BRANCH" | grep -Ev "$allowed"); then
            echo "::error::the pin commit touches paths outside the pin outputs: $other"
            exit 1
          fi
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="$auth" push origin "refs/heads/$BRANCH:refs/heads/$BRANCH"
          title="chore(pin): hashicorp/aws $NEXT"
          draft=false
          if [ "$STATUS" = owner-action ]; then title="$title (needs owner action)"; draft=true; fi
          gh api "repos/$REPO/pulls" -f title="$title" -f head="$BRANCH" -f base=master \
            -F body=@"$d/body.md" -F draft="$draft" >"$RUNNER_TEMP/pr.json"
          echo "pr=$(jq -r .number "$RUNNER_TEMP/pr.json")" >>"$GITHUB_OUTPUT"
          echo "::notice::opened $(jq -r .html_url "$RUNNER_TEMP/pr.json")"
          # A run that will not merge is red, so the waiting PR is noticed.
          [ "$STATUS" = ok ] || { echo "::error::make pin stopped for an owner decision; see the draft PR"; exit 1; }
          [ "$RESIGN" = false ] || { echo "::error::cis.tar.gz must be re-signed; see the PR"; exit 1; }

  # The full Test workflow on the pin commit, with a read-only token.
  test:
    name: Test the pin commit
    needs: [pin, publish]
    if: needs.pin.outputs.status == 'ok' && needs.pin.outputs.resign == 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.pin.outputs.sha }}

  # Runs no repository code. The owner-approval status it sets covers only
  # the pin commit this run made, checked against the make pin outputs in
  # publish and tested above; the merge API refuses if the PR head moved.
  merge:
    name: Merge, tag and release
    needs: [pin, publish, test]
    if: needs.pin.outputs.status == 'ok' && needs.pin.outputs.resign == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Merge the tested commit, tag it and dispatch the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NEXT: ${{ needs.pin.outputs.next }}
          BRANCH: ${{ needs.pin.outputs.branch }}
          SHA: ${{ needs.pin.outputs.sha }}
          PR: ${{ needs.publish.outputs.pr }}
        run: |
          set -euo pipefail
          [[ "$NEXT" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ && "$BRANCH" == "pin/hashicorp-aws-$NEXT" ]] \
            || { echo "::error::bad version or branch: $NEXT $BRANCH"; exit 1; }
          [[ $SHA =~ ^[0-9a-f]{40}$ && $PR =~ ^[0-9]+$ ]] || { echo "::error::bad SHA or PR: $SHA $PR"; exit 1; }
          hold() { echo "::error::PR #$PR not merged: $*; merge, tag and release it by hand"; exit 1; }
          # Each step below is skipped when a rerun finds it done.
          gh api "repos/$REPO/pulls/$PR" >"$RUNNER_TEMP/pr.json"
          if jq -e --arg sha "$SHA" '.merged == true and .head.sha == $sha' "$RUNNER_TEMP/pr.json" >/dev/null; then
            merged=$(jq -r .merge_commit_sha "$RUNNER_TEMP/pr.json")
          else
            jq -e --arg sha "$SHA" --arg repo "$REPO" --arg branch "$BRANCH" '
              .state == "open" and .draft == false and .head.sha == $sha and .head.ref == $branch
              and .head.repo.full_name == $repo and .base.repo.full_name == $repo and .base.ref == "master"' \
              "$RUNNER_TEMP/pr.json" >/dev/null || hold "it is not the open pin PR at $SHA"
            # The squash must land the tested tree: master is still the pin
            # commit's parent (checked in publish).
            # shortcut: a push to master between this check and the merge lands untested; a merge queue would close it.
            tip=$(gh api "repos/$REPO/git/ref/heads/master" --jq .object.sha)
            [ "$tip" = "$GITHUB_SHA" ] || hold "master moved to $tip after the pin"
            gh api --silent "repos/$REPO/statuses/$SHA" -f state=success -f context=owner-approval \
              -f description="pin commit tested by upstream-watch" \
              -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
            merged=$(gh api -X PUT "repos/$REPO/pulls/$PR/merge" -f merge_method=squash -f sha="$SHA" \
              -f commit_title="chore(pin): hashicorp/aws $NEXT (#$PR)" --jq .sha)
          fi
          [[ $merged =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad merge SHA: $merged"; exit 1; }
          # Annotated tag, as a hand release; the release-tags ruleset must let GitHub Actions create v* tags.
          ref=$(gh api "repos/$REPO/git/matching-refs/tags/v$NEXT" --jq ".[] | select(.ref == \"refs/tags/v$NEXT\") | .object.sha")
          if [ -z "$ref" ]; then
            tag=$(gh api "repos/$REPO/git/tags" -f tag="v$NEXT" -f message="v$NEXT" -f object="$merged" -f type=commit --jq .sha)
            gh api --silent "repos/$REPO/git/refs" -f ref="refs/tags/v$NEXT" -f sha="$tag"
          elif [ "$(gh api "repos/$REPO/git/tags/$ref" --jq .object.sha)" != "$merged" ]; then
            echo "::error::tag v$NEXT exists and is not the annotated tag of $merged"
            exit 1
          fi
          gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[].tag_name' >"$RUNNER_TEMP/released.txt"
          if ! grep -qxF "v$NEXT" "$RUNNER_TEMP/released.txt"; then
            gh api --silent -X POST "repos/$REPO/actions/workflows/release.yml/dispatches" -f ref="v$NEXT"
          fi
          gh api --silent -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" || echo "::warning::could not delete $BRANCH"
          echo "Merged PR #$PR as $merged, tagged v$NEXT and dispatched release.yml." >>"$GITHUB_STEP_SUMMARY"
