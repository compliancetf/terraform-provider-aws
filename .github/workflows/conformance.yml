name: Conformance

# No push/pull_request triggers: the workflow runs on demand; run locally.
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  fakeupstream:
    name: Fake upstream module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: test/fakeupstream/go.mod
      - run: go test ./...
        working-directory: test/fakeupstream

  cells:
    name: Matrix cells
    runs-on: ubuntu-latest
    outputs:
      cells: ${{ steps.cells.outputs.cells }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cells
        run: echo "cells=$(jq -c .cells test/conformance/matrix.json)" >> "$GITHUB_OUTPUT"

  conformance:
    name: ${{ matrix.cell.name }}
    needs: cells
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.cells.outputs.cells) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # "1.5.x" -> newest stable 1.5 release; "latest" -> newest stable release.
      - name: Resolve version
        id: resolve
        env:
          PRODUCT: ${{ matrix.cell.product }}
          VERSION: ${{ matrix.cell.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$PRODUCT" in
            terraform) all=$(curl -fsSL https://releases.hashicorp.com/terraform/index.json | jq -r '.versions | keys[]') ;;
            opentofu) all=$(gh api 'repos/opentofu/opentofu/releases?per_page=100' --jq '.[] | select(.prerelease | not) | .tag_name | ltrimstr("v")') ;;
            *) echo "unknown product $PRODUCT"; exit 1 ;;
          esac
          prefix=""
          if [ "$VERSION" != latest ]; then prefix="${VERSION%x}"; fi
          v=$(printf '%s\n' "$all" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | awk -v p="$prefix" 'index($0, p) == 1' | sort -V | tail -1)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - if: matrix.cell.product == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.resolve.outputs.version }}
          terraform_wrapper: false
      - if: matrix.cell.product == 'opentofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ steps.resolve.outputs.version }}
          tofu_wrapper: false
      - name: Conformance
        env:
          CELL: ${{ matrix.cell.name }}
          BIN: ${{ matrix.cell.product == 'opentofu' && 'tofu' || 'terraform' }}
        run: |
          set -euo pipefail
          echo "| $CELL | $("$BIN" version | head -1) |" >> "$GITHUB_STEP_SUMMARY"
          go test -count=1 -v -tags conformance ./test/conformance/... -tf "$(command -v "$BIN")"
