name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# One release at a time: a running publish is never cancelled. GitHub keeps
# one pending run per group, so a third tag pushed while one runs and one
# waits replaces the waiting run; re-push that tag's run by hand if it happens.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Gate: the "release" environment has a required reviewer, and v* tags
    # are restricted by a tag ruleset.
    environment: release
    outputs:
      backfill: ${{ steps.origin.outputs.backfill }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Only release commits that reached master through the protected-path
      # gate, or a backfill (scripts/backfill.sh): one commit on a master
      # commit that changes pins.json alone, as a regular file, to an older
      # X.Y.Z of the same major. A tag commit can edit this file, so a tag
      # ruleset (owner settings) must also restrict who may push v* tags; a
      # backfill commit cannot, because it changes nothing but pins.json.
      - name: Require the tagged commit on master, or a pins-only backfill on it
        id: origin
        run: |
          set -euo pipefail
          commit=$(git rev-parse "$GITHUB_SHA^{commit}")
          if git merge-base --is-ancestor "$commit" origin/master; then
            echo "backfill=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$(git rev-list --parents -n1 "$commit" | wc -w)" -eq 2 ] || { echo "::error::a backfill commit has exactly one parent"; exit 1; }
          git merge-base --is-ancestor "$commit^" origin/master || { echo "::error::the tagged commit is not on master, nor one commit on a master commit"; exit 1; }
          changes=$(git diff-tree -r --no-renames --no-commit-id "$commit^" "$commit")
          printf '%s\n' "$changes" | grep -Eqx $':100644 100644 [0-9a-f]{40} [0-9a-f]{40} M\tpins\\.json' && [ "$(printf '%s\n' "$changes" | wc -l)" -eq 1 ] \
            || { echo "::error::a backfill commit modifies the regular file pins.json and nothing else"; exit 1; }
          new=$(git show "$commit:pins.json" | jq -r .version)
          cur=$(git show origin/master:pins.json | jq -r .version)
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$new" =~ $semver && "$cur" =~ $semver ]] || { echo "::error::pins.json versions must be X.Y.Z (got $new, master $cur)"; exit 1; }
          [ "${new%%.*}" = "${cur%%.*}" ] && [ "$new" != "$cur" ] \
            && [ "$(printf '%s\n%s\n' "$cur" "$new" | sort -t. -k1,1n -k2,2n -k3,3n | head -n1)" = "$new" ] \
            || { echo "::error::backfill $new is not older than the master pin $cur in the same major"; exit 1; }
          echo "backfill=true" >> "$GITHUB_OUTPUT"
          echo "version=$new" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # A backfill's pins.json must be what tools/pinupstream derives for its
      # version from HashiCorp's signed SHA256SUMS, byte for byte.
      - name: Re-derive the pins of a backfill
        if: steps.origin.outputs.backfill == 'true'
        env:
          VERSION: ${{ steps.origin.outputs.version }}
        run: |
          set -euo pipefail
          go run ./tools/pinupstream -version "$VERSION" -out "$RUNNER_TEMP/pins.json"
          cmp pins.json "$RUNNER_TEMP/pins.json" || { echo "::error::pins.json is not the pinupstream output for $VERSION"; exit 1; }
      # refuse to publish a build that enforces no
      # control. Fails unless main.go wires the Phase 0B lifecycle.
      # A skipped, renamed or tag-excluded test exits 0, so require its PASS line.
      - name: Refuse a release without a compliance evaluator
        run: |
          set -o pipefail
          go test -v -count=1 -run '^TestReleaseGuard$' . | tee "$RUNNER_TEMP/guard.out"
          grep -q '^--- PASS: TestReleaseGuard ' "$RUNNER_TEMP/guard.out"
        env:
          COMPLIANCETF_RELEASE_GUARD: '1'
      # the release keyring must hold its floor keys (current and
      # next generation); without the env var zero floor keys only log. The
      # embedded CIS archive must be signed by a release bundle key over the
      # payload built from cis/ (TestReleaseKeyGuard).
      - name: Refuse a release keyring without floor keys or a stale CIS archive
        run: |
          set -o pipefail
          go test -v -count=1 -run '^TestRelease' ./internal/trust ./internal/embedded | tee "$RUNNER_TEMP/keyring.out"
          grep -q '^--- PASS: TestReleaseFloorKeyCount ' "$RUNNER_TEMP/keyring.out"
          grep -q '^--- PASS: TestReleaseKeyGuard ' "$RUNNER_TEMP/keyring.out"
        env:
          COMPLIANCETF_RELEASE_KEYRING_CHECK: '1'
      # compliancetf/aws X.Y.Z proxies exactly hashicorp/aws X.Y.Z: the tag
      # must be the pins.json version, optionally with -beta.N or
      # -compliancetf.N. The goreleaser before hook repeats this check.
      - name: Require the tag to match the pinned upstream version
        run: go run ./tools/releasemeta -version="$GITHUB_REF_NAME"
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      # goreleaser is installed fail closed. The tarball must match
      # the pinned sha256, and checksums.txt must carry goreleaser's own
      # sigstore signature (cosign verify-blob, pinned identity and issuer).
      # goreleaser-action skips the signature when the bundle download fails.
      # Bump: scripts/bump-goreleaser.sh vX.Y.Z runs the same cosign verify-blob
      # on that release's checksums.txt locally, checks the Linux_x86_64
      # tarball against it and rewrites both pins; --check re-verifies the
      # current pins. Never drop a step.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Install goreleaser (pinned sha256, cosign verified)
        env:
          GORELEASER_VERSION: v2.18.2
          GORELEASER_SHA256: 0a96edc9d9bc594e4a41cc4d59467c182062910ab24d9d1f6dd7b667d32606d3
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/goreleaser"
          mkdir -p "$dir"
          cd "$dir"
          base="https://github.com/goreleaser/goreleaser/releases/download/$GORELEASER_VERSION"
          for f in goreleaser_Linux_x86_64.tar.gz checksums.txt checksums.txt.sigstore.json; do
            curl -fsSL --proto '=https' -o "$f" "$base/$f"
          done
          echo "$GORELEASER_SHA256  goreleaser_Linux_x86_64.tar.gz" | sha256sum -c -
          cosign verify-blob \
            --certificate-identity "https://github.com/goreleaser/goreleaser/.github/workflows/release.yml@refs/tags/$GORELEASER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --bundle checksums.txt.sigstore.json checksums.txt
          grep -qx "$GORELEASER_SHA256  goreleaser_Linux_x86_64.tar.gz" checksums.txt
          tar -xzf goreleaser_Linux_x86_64.tar.gz goreleaser
          echo "$dir" >> "$GITHUB_PATH"
      # .goreleaser.yml runs tools/releasegate on every built binary (tags,
      # HashiCorp key, org pin, evaluator); --skip=before cannot bypass it.
      # The release notes are the CHANGELOG.md section of this tag: the
      # conventional commits since the previous tag (tools/changelog). A
      # backfill names the master commit it was built from instead.
      - name: Render the release notes
        env:
          BACKFILL: ${{ steps.origin.outputs.backfill }}
        run: |
          set -euo pipefail
          if [ "$BACKFILL" = true ]; then
            printf 'NOTES:\n\n* backfill: compliancetf/aws %s for hashicorp/aws %s, built from master %s\n' \
              "${GITHUB_REF_NAME#v}" "${GITHUB_REF_NAME#v}" "$(git rev-parse --short "$GITHUB_SHA^{commit}^")" > "$RUNNER_TEMP/notes.md"
          else
            go run ./tools/changelog -version "$GITHUB_REF_NAME" -notes > "$RUNNER_TEMP/notes.md"
          fi
      - name: Release
        run: goreleaser release --clean --release-notes "$RUNNER_TEMP/notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          # .goreleaser.yml: a backfill is never marked the latest release.
          CTF_BACKFILL: ${{ steps.origin.outputs.backfill }}

  # After a published release, a PR puts the same section at the top of
  # CHANGELOG.md on master. PRs opened with GITHUB_TOKEN start no workflows:
  # the owner merges it by hand, like the pin PRs.
  changelog:
    name: Open the CHANGELOG PR
    needs: release
    # A backfill adds no CHANGELOG.md section: it changes only the pin.
    if: needs.release.outputs.backfill != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Update CHANGELOG.md, push the branch, open the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # tools/changelog rejects anything but vX.Y.Z[-pre], before the name reaches git.
          go run ./tools/changelog -version "$GITHUB_REF_NAME" -update CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            echo "::notice::CHANGELOG.md already has $GITHUB_REF_NAME"
            exit 0
          fi
          branch="changelog/$GITHUB_REF_NAME"
          git switch -q -c "$branch"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "docs(changelog): $GITHUB_REF_NAME" -- CHANGELOG.md
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="$auth" push origin "refs/heads/$branch:refs/heads/$branch"
          url=$(gh api "repos/$REPO/pulls" -f title="docs(changelog): $GITHUB_REF_NAME" -f head="$branch" -f base=master \
            -f body="Adds the $GITHUB_REF_NAME release notes to CHANGELOG.md (tools/changelog). Merge by hand." --jq .html_url)
          echo "::notice::opened $url"
